# Dokploy (Traefik) termina el HTTPS y llega por http: se le avisa a PHP para que
# las URLs (fotos, canónica, sitemap) salgan con https y no como contenido mixto
map $http_x_forwarded_proto $racc_https {
    default "";
    https   on;
}

server {
    listen 80 default_server;

    # la IP real del visitante (límite de intentos de login por persona, no por proxy)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # fotos y certificados que suben los artistas
    client_max_body_size 25M;

    # assets del build: nombres con hash, se pueden cachear para siempre
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $racc_https if_not_empty;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
