services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: backend
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    ports:
      - "8000:8000"

  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    depends_on:
      - backend
    volumes:
      - ./fronted:/app
      - frontend_modules:/app/node_modules
    ports:
      - "9000:9000"
    command: sh -c "npm install --no-audit --no-fund && npx quasar dev -H 0.0.0.0 -p 9000"

volumes:
  db_data:
  backend_vendor:
  frontend_modules:
